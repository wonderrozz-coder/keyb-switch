[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keyb-switch"
version = "0.9.0"
description = "Punto Switcher style keyboard layout autocorrection for Hyprland/Wayland"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "keyb-switch contributors" }]
keywords = ["keyboard", "layout", "wayland", "hyprland", "punto-switcher", "hunspell"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
]
dependencies = ["evdev>=1.6"]

[project.urls]
Homepage = "https://github.com/<логин>/keyb-switch"
Issues = "https://github.com/<логин>/keyb-switch/issues"

[project.scripts]
keyb-switch = "kbswitch.cli:main"

[tool.setuptools]
packages = ["kbswitch"]

[tool.setuptools.package-data]
kbswitch = ["../dict/*"]
